name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# GitHub forces actions onto Node 24 from 2026-06-16; opt in early so the
# switch is verified green here rather than breaking the workflows that day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:db
      - run: node --test tests/author-policy.test.mjs
      - run: node --test tests/schedule-ui-safety.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
